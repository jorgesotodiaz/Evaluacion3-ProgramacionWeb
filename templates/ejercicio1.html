<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Ejercicio 1 - Notas</title>
    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/estilos.css') }}">
</head>
<body>

<div class="formulario">
    <h2>Formulario de Notas</h2>

    <form method="POST">
        <label>Nota 1:</label>
        <input type="number" name="nota1"
               min="10" max="70" step="1" required>

        <label>Nota 2:</label>
        <input type="number" name="nota2"
               min="10" max="70" step="1" required>

        <label>Nota 3:</label>
        <input type="number" name="nota3"
               min="10" max="70" step="1" required>

        <label>Asistencia (%):</label>
        <input type="number" name="asistencia"
               min="0" max="100" step="1" required>

        <button type="submit">Enviar</button>
    </form>

    {% if promedio is not none %}
        <p>Promedio: {{ promedio }}</p>
        <p>Estado: {{ estado }}</p>
    {% endif %}

    <a class="volver" href="/">Volver al menú</a>
</div>

</body>
</html>

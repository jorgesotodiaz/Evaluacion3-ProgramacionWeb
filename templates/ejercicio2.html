<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Ejercicio 2 - Nombres</title>
    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/estilos.css') }}">
</head>
<body>

<div class="formulario">
    <h2>Formulario de Nombres</h2>

    <form method="POST">
        <label for="nombre1">Nombre 1:</label>
        <input type="text" id="nombre1"
               name="nombre1" required>

        <label for="nombre2">Nombre 2:</label>
        <input type="text" id="nombre2"
               name="nombre2" required>

        <label for="nombre3">Nombre 3:</label>
        <input type="text" id="nombre3"
               name="nombre3" required>

        <button type="submit">Enviar</button>
    </form>

    {% if nombre_mayor %}
        <p>El nombre con mayor cantidad de caracteres es:
            <strong>{{ nombre_mayor }}</strong>
        </p>

        <p>El nombre tiene:
            <strong>{{ cantidad }} caracteres</strong>
        </p>
    {% endif %}

    {% if error %}
        <p>{{ error }}</p>
    {% endif %}

    <a class="volver" href="/">Volver al menú</a>
</div>

</body>
</html>
